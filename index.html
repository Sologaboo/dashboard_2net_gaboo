<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SwiftDesk Cloud - Buscador de Speech</title>
  <meta name="description" content="Busca, organiza y administra speeches de SwiftDesk por categoría. Incluye herramientas de prorrateo y calendario operativo.">
  <meta name="application-name" content="SwiftDesk Cloud">
  <meta name="theme-color" content="#000000">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_VE">
  <meta property="og:site_name" content="SwiftDesk Cloud">
  <meta property="og:title" content="SwiftDesk Cloud - Buscador de Speeches">
  <meta property="og:description" content="Busca, organiza y administra speeches de SwiftDesk por categoría. Incluye herramientas de prorrateo y calendario operativo.">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="SwiftDesk Cloud - Buscador de Speeches">
  <meta name="twitter:description" content="Busca, organiza y administra speeches de SwiftDesk por categoría. Incluye herramientas de prorrateo y calendario operativo.">
  <link rel="icon" href="apoyo-tecnico.png" type="image/png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="calculator-style.css">
  <link rel="stylesheet" href="calendar-style.css">
</head>
<body>

  <!-- Header Superior con Buscador -->
  <header class="top-header">
    <div class="header-content">
      <h1 class="logo">Swift<span>Desk</span></h1>
      
      <div class="header-actions">
          <div class="search-box">
            <input 
              type="text" 
              id="search-input" 
              placeholder="Buscar speech por título o contenido..." 
              autocomplete="off"
            />
            <button type="button" id="clear-btn" class="clear-btn hidden" title="Limpiar">&times;</button>
          </div>
          <button id="open-modal-btn" class="add-btn">+ Nuevo Speech</button>
        </div>
      </div>
  </header>
  <!-- Panel Principal -->
  <main class="main-content">
    <!-- Categorías -->
    <nav class="categories-bar">
      <button class="cat-btn active" data-category="all">Todos</button>
      <button class="cat-btn favorites-cat" data-category="favorites">⭐ Favoritos</button>
      <button class="cat-btn" data-category="saludos">Saludos</button>
      <button class="cat-btn" data-category="soporte">Soporte Técnico</button>
      <button class="cat-btn" data-category="pagos">Pagos y Facturación</button>
      <button class="cat-btn" data-category="audio">Audio</button>
      <button class="cat-btn" data-category="ticket">Ticket</button>
      <button class="cat-btn" data-category="iptv">IPTV</button>
      <button class="cat-btn" data-category="despedida">Despedida</button>
    </nav>
    <!-- Estado de Carga / Mensajes -->
    <div id="status-message" class="status-message">Cargando speeches desde SwiftDesk...</div>
    <!-- Grilla de Tarjetas -->
    <section id="speeches-grid" class="speeches-grid"></section>
  </main>
  <!-- Modal para Agregar / Editar Speech -->
  <div id="speech-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-title">Crear Nuevo Speech</h2>
        <button id="close-modal-btn" class="close-btn">&times;</button>
      </div>
      <form id="speech-form">
        <input type="hidden" id="speech-id">
        <div class="form-group">
          <label for="speech-title">Título del Speech:</label>
          <input type="text" id="speech-title" placeholder="Ej: Infraestructura, soporte técnico, pagos..." required>
        </div>
        <div class="form-group">
          <label for="speech-category">Categoría:</label>
          <select id="speech-category" required>
            <option value="saludos">Saludos</option>
            <option value="soporte">Soporte Técnico</option>
            <option value="audio">Audio</option>
             <option value="ticket">Ticket</option>
            <option value="iptv">IPTV</option>
            <option value="pagos">Pagos y Facturación</option>
            <option value="despedida">Despedida</option>
          </select>
        </div>
        <div class="form-group">
          <label for="speech-text">Contenido del Speech:</label>
          <textarea id="speech-text" rows="5" placeholder="Escribe el texto aquí..." required></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" id="cancel-modal-btn" class="btn-secondary">Cancelar</button>
          <button type="submit" class="btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>
  <!-- Módulo de Calculadora de Prorrateo Flotante -->
<div id="prorrateo-widget" class="prorrateo-widget">
  <!-- Botón Flotante Calculadora de Prorrateo -->
  <button id="prorrateo-toggle" class="prorrateo-fab" title="Calculadora de Prorrateo">
    🧮
  </button>
  <!-- Panel Desplegable de la Calculadora -->
  <div id="prorrateo-panel" class="prorrateo-panel hidden">
    <div class="prorrateo-header">
      <h3>Calculadora de Prorrateo</h3>
      <button id="prorrateo-close" class="prorrateo-close-btn">&times;</button>
    </div>
    <div class="prorrateo-body">
      <div class="prorrateo-field">
        <label for="prorrateo-dias">Días a calcular:</label>
        <input type="number" id="prorrateo-dias" placeholder="Ej. 15" min="1" max="31">
      </div>
      <div class="prorrateo-field">
        <label for="prorrateo-monto">Monto total del plan:</label>
        <input type="number" id="prorrateo-monto" placeholder="Ej. 25.00" step="0.01" min="0">
      </div>
      <div class="prorrateo-result">
        <span>Total a pagar:</span>
        <h3 id="prorrateo-output">$0.00</h3>
      </div>
    </div>
  </div>
</div>
<!-- Botón Flotante de Calendario -->
<button id="btnFloatingCalendar" class="floating-calendar-btn" title="Ver Agenda y Tareas">
  📅
</button>
<!-- Ventana Emergente (Modal) -->
<div id="calendarModal" class="calendar-modal hidden">
  <div class="calendar-modal-content">
    <div class="calendar-modal-header">
      <h3>Agenda Operativa Infraestructura / Tareas del Día</h3>
      <span id="btnCloseCalendar" class="close-btn">&times;</span>
    </div>
    <div class="calendar-modal-body">
      <!-- Enlace de Google Calendar -->
      <iframe
        src="https://calendar.google.com/calendar/embed?src=dc653f2f0ce9bf1dc649092c69c28a36b2425c40fb3e682c1edc6d0061ca3d29%40group.calendar.google.com&amp;ctz=America%2FCaracas"
        title="Agenda operativa"
        loading="lazy"
      ></iframe>
    </div>
  </div>
</div>
  <script src="calendar.js"></script>
  <script src="apportionment.js"></script>
  <script src="greeting-time.js"></script>
  <script src="script.js"></script>
</body>
</html>
